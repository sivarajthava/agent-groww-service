name: Weekly review pulse

on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC = 09:00 IST
  pull_request:            # eval-offline only
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week YYYY-Www (default: current week)"
        required: false
      live_eval:
        description: "Also run the live eval (uses GROQ_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-pulse-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  pulse:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PULSE_ID_SALT: ${{ secrets.PULSE_ID_SALT }}
      GMAIL_MCP_AUTH: ${{ secrets.GMAIL_MCP_AUTH }}
      # Publishing is opt-in: set the repository variable PULSE_PUBLISH=true once the MCP servers are configured.
      PULSE_PUBLISH: ${{ vars.PULSE_PUBLISH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4   # stdio MCP servers are commonly started with npx
        with:
          node-version: "20"

      - name: Install
        run: |
          pip install -e .
          python -m spacy download en_core_web_sm

      # Only the scrubbed SQLite database is kept between runs (last week's themes, idempotent re-runs).
      # Raw snapshots may contain user names, so they are never cached or uploaded.
      - name: Restore review database
        uses: actions/cache/restore@v4
        with:
          path: data/reviews.sqlite
          key: pulse-db-${{ github.run_id }}
          restore-keys: pulse-db-

      - name: Run pulse
        id: run
        shell: bash
        env:
          WEEK: ${{ github.event.inputs.week }}   # via env, never interpolated into the script
        run: |
          args=(run)
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); fi
          if [ "$PULSE_PUBLISH" != "true" ]; then args+=(--dry-run); fi
          pulse "${args[@]}"

      - name: Save review database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/reviews.sqlite
          key: pulse-db-${{ github.run_id }}

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-run-${{ github.run_id }}
          path: data/runs/
          if-no-files-found: ignore
          retention-days: 30

  # Offline evals: fakes only, no secrets. Gates PII, quote fidelity, structure and the edge-case suite.
  eval-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PULSE_ID_SALT: eval-offline-salt   # not a secret: offline evals only touch synthetic data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Tests
        run: pytest -q -m "not slow"
      - name: Offline eval
        run: pulse eval --report evals/reports/ci-offline.md
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-offline-${{ github.run_id }}
          path: evals/reports/ci-offline.*
          if-no-files-found: ignore

  # Read-only web frontend: data-layer tests and a production build (type-checks) on synthetic fixtures.
  web:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Live evals: real Groq writer, judge and agent. Weekly, or on demand. Fails on a gate or a regression
  # of more than 0.05 against the committed evals/reports/baseline.json.
  eval-live:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live_eval)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PULSE_ID_SALT: ${{ secrets.PULSE_ID_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e .
          python -m spacy download en_core_web_sm
      - name: Live eval
        run: pulse eval --live --repeats 3 --report evals/reports/ci-live.md
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-${{ github.run_id }}
          path: evals/reports/ci-live.*
          if-no-files-found: ignore
