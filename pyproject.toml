[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groww-pulse"
version = "0.1.0"
description = "Weekly pulse of Groww Google Play reviews, published to Google Docs and Gmail via MCP"
requires-python = ">=3.11"
dependencies = [
    "google-play-scraper>=1.2.7",
    "groq>=0.30",
    "jsonschema>=4.21",
    "langdetect>=1.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "spacy>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pulse = "groww_pulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: needs downloaded local models"]
